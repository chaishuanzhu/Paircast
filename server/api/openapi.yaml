openapi: 3.0.3
info:
  title: Paircast Server HTTP API
  version: "1.0.0"
  description: |
    Paircast 服务端的账号（`/account/*`）、管理后台（`/console/*`）、媒体库（`/media/*`）与观影房间（`/room/*`）接口。

    **账号**：账号归 Paircast 所有（邮箱 + 密码，管理员建号），每个账号在 GO-IM 有一个镜像用户。
    对客户端暴露的用户 ID（`uid`）一律是 GO-IM uid。登录 / 会话接口同时返回 Paircast 会话令牌和 GO-IM 连接信息
    （`im.url` 为空表示与本服务同源，`im.token` 用于 GO-IM 的 WebSocket、上传、拉黑、举报等接口）。

    **认证**：Paircast 会话令牌（登录返回的 `token`）。带 `token` 参数（查询或表单），或 `Authorization: Bearer <token>`；
    带 `uid` 参数时必须与账号一致，否则 403。改密、禁用、删除后旧令牌返回 401。

    **约定**：POST 请求体为 `application/x-www-form-urlencoded`（`/media/subtitles/share` 为 `multipart/form-data`）；
    时间戳为 Unix 毫秒；错误响应为纯文本。房间变化通过 GO-IM 群信令 `paircast.room_updated` 推送（`data` 为 `{"group_id","room"}`）。
servers:
  - url: /
security:
  - uid: []
    token: []
tags:
  - name: 账号
    description: 登录、会话、改密、资料、注销
  - name: 管理后台
    description: 账号管理与举报审核（仅管理员）
  - name: 媒体库
    description: 视频源（S3 兼容存储等）、播放直链、字幕、贴纸
  - name: 观影房间
    description: 一起看房间（同时建 GO-IM 群），变化通过群信令 `paircast.room_updated` 推送
paths:
  /account/login:
    post:
      tags: [账号]
      summary: 登录
      security: []
      description: 首次登录（管理员建号的初始密码）`must_change_password` 为 true，客户端应先调用 `/account/password`。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string, description: 邮箱或 GO-IM uid }
                password: { type: string }
      responses:
        "200":
          description: 会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "`invalid account or password`", content: { text/plain: { schema: { type: string } } } }
        "403": { description: "`account disabled`", content: { text/plain: { schema: { type: string } } } }
        "502": { $ref: "#/components/responses/IMUnavailable" }

  /account/session:
    get:
      tags: [账号]
      summary: 校验会话并刷新 IM 令牌
      description: 启动恢复登录、GO-IM 令牌过期时调用；返回最新资料与新的 `im.token`，`token` 原样返回。
      responses:
        "200":
          description: 会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/IMUnavailable" }

  /account/password:
    post:
      tags: [账号]
      summary: 修改密码
      description: 清除 `must_change_password`；其他设备上的会话全部失效，响应带新的会话令牌。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string, minLength: 6, maxLength: 72 }
      responses:
        "200":
          description: 已修改
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  token: { type: string, description: 新的会话令牌 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "`invalid current password`，或令牌无效", content: { text/plain: { schema: { type: string } } } }

  /account/profile:
    get:
      tags: [账号]
      summary: 自己的资料
      responses:
        "200":
          description: 资料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [账号]
      summary: 修改昵称 / 头像
      description: 头像先用 GO-IM 令牌上传到 GO-IM `/upload`，再把文件 ID 传到这里；资料同步到 GO-IM 镜像用户。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 32 }
                avatar_file_id: { type: integer, format: int64, description: 0 清除头像；须是自己上传的图片 }
      responses:
        "200":
          description: 更新后的资料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/IMUnavailable" }

  /account/delete:
    post:
      tags: [账号]
      summary: 注销自己的账号
      description: 连同 GO-IM 镜像用户一起删除；管理员不能自助注销。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "401": { description: "`invalid password`，或令牌无效", content: { text/plain: { schema: { type: string } } } }
        "403": { description: "`admin accounts cannot be deleted here`", content: { text/plain: { schema: { type: string } } } }
        "502": { $ref: "#/components/responses/IMUnavailable" }

  /console/users:
    get:
      tags: [管理后台]
      summary: 账号列表
      parameters:
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: 一页账号（新的在前）
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }

  /console/users/create:
    post:
      tags: [管理后台]
      summary: 建号
      description: 以随机初始密码建号（首次登录须改密）。配置了发信时把密码发到邮箱，否则 / 发送失败时响应带 `initial_password`，由管理员转交。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                nickname: { type: string, maxLength: 32, description: 默认取邮箱 @ 前部分 }
      responses:
        "200":
          description: 已建号
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  user: { $ref: "#/components/schemas/AdminUser" }
                  mailed: { type: boolean }
                  initial_password: { type: string, description: 仅在未能发信时返回 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }
        "409": { description: "`email already registered`", content: { text/plain: { schema: { type: string } } } }
        "502": { $ref: "#/components/responses/IMUnavailable" }

  /console/users/disable:
    post:
      tags: [管理后台]
      summary: 禁用 / 启用账号
      description: 禁用让该账号的会话失效，并禁用 GO-IM 镜像用户（立即下线）。不能禁用自己。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [target_uid, disabled]
              properties:
                target_uid: { type: string, description: GO-IM uid }
                disabled: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/IMUnavailable" }

  /console/users/delete:
    post:
      tags: [管理后台]
      summary: 删除账号
      description: 连同 GO-IM 镜像用户一起删除。不能删除自己。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [target_uid]
              properties:
                target_uid: { type: string, description: GO-IM uid }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/IMUnavailable" }

  /console/reports:
    get:
      tags: [管理后台]
      summary: 举报列表
      description: 用户在 GO-IM 里提交的举报（GO-IM 服务端 API `reports/list`）。
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, handled, all], default: pending } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: 一页举报（新的在前）
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items: { $ref: "#/components/schemas/Report" }
                  total: { type: integer }
                  pending: { type: integer, description: 全部待处理条数 }
                  offset: { type: integer }
                  limit: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }
        "502": { $ref: "#/components/responses/IMUnavailable" }

  /console/reports/resolve:
    post:
      tags: [管理后台]
      summary: 处理举报
      description: "`ignore` 只标记这条；`ban` 禁用被举报人的 GO-IM 与 Paircast 账号，并结清针对他的其他待处理举报。管理员不能被封禁。"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [id, action]
              properties:
                id: { type: integer, format: int64 }
                action: { type: string, enum: [ignore, ban] }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`admin required` 或 `cannot ban an admin`", content: { text/plain: { schema: { type: string } } } }
        "404": { description: "`report not found`", content: { text/plain: { schema: { type: string } } } }
        "502": { $ref: "#/components/responses/IMUnavailable" }

  /media/sources:
    get:
      tags: [媒体库]
      summary: 已配置的视频源与服务端能力
      responses:
        "200":
          description: 视频源列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/MediaSource" }
                  online_subtitles: { type: boolean, description: 服务端是否配置了在线字幕（OpenSubtitles） }
                  stickers: { type: boolean, description: 是否配置了贴纸目录 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /media/items:
    get:
      tags: [媒体库]
      summary: 影片列表
      description: |
        合并多个视频源时按 `source` 过滤；`next_cursor` 为空表示没有更多。列表只附带已缓存的元数据，
        `enrich=1` 会在返回前刮削本页缺失的元数据（较慢）。
      parameters:
        - { name: source, in: query, description: 视频源 ID，默认 `media.default_source`, schema: { type: string } }
        - { name: q, in: query, description: 按标题 / 文件名过滤, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 500 } }
        - { name: refresh, in: query, description: "`1` 忽略列表缓存", schema: { type: string, enum: ["1"] } }
        - { name: enrich, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: 一页影片
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MediaItem" }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/Upstream" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /media/item:
    get:
      tags: [媒体库]
      summary: 单部影片（含元数据）
      description: "`id` 形如 `<source>:<native>`；不带已知前缀时视为默认视频源下的原生 ID。"
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, example: "oss:films/Inception.2010.mkv" } }
      responses:
        "200":
          description: 影片
          content: { application/json: { schema: { $ref: "#/components/schemas/MediaItem" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /media/play:
    get:
      tags: [媒体库]
      summary: 播放直链
      description: S3 兼容源返回预签名 URL（默认 6 小时），视频流不经过网关。客户端在 `expires_at` 前重新获取。
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: 播放信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: integer, format: int64 }
                  format: { type: string, example: mkv }
                  headers: { type: object, additionalProperties: { type: string }, description: 播放时需附带的请求头（可选） }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /media/subtitles:
    get:
      tags: [媒体库]
      summary: 影片的字幕列表
      description: 返回与影片同目录的外挂字幕；带 `room_id`（且调用者是成员）时把房主共享的字幕放在第一位。
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: room_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: 字幕列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  subtitles:
                    type: array
                    items: { $ref: "#/components/schemas/SubtitleRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /media/subtitle:
    get:
      tags: [媒体库]
      summary: 读取字幕文件
      description: "`ref` 来自字幕列表 / 共享 / 在线下载（`src:` 或 `blob:` 前缀）。响应头 `X-Subtitle-Format` 为扩展名。"
      parameters:
        - { name: ref, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: 字幕内容（最大 2 MB）
          content: { text/plain: { schema: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /media/subtitles/search:
    get:
      tags: [媒体库]
      summary: 在线搜索字幕
      description: 经服务端调用 OpenSubtitles（API Key 只在服务端）。结果的 `ref` 为 `os:<file_id>`，需先 `POST /media/subtitles/fetch`。
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: year, in: query, schema: { type: string } }
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  subtitles:
                    type: array
                    items: { $ref: "#/components/schemas/SubtitleRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { description: 未配置在线字幕, content: { text/plain: { schema: { type: string } } } }
        "502": { $ref: "#/components/responses/Upstream" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /media/subtitles/fetch:
    post:
      tags: [媒体库]
      summary: 下载在线字幕到服务器
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [ref]
              properties:
                ref: { type: string, example: "os:123456" }
      responses:
        "200":
          description: 可用 `/media/subtitle` 读取的 ref
          content:
            application/json:
              schema: { type: object, properties: { ref: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: 每个用户每分钟最多下载 10 个在线字幕, content: { text/plain: { schema: { type: string } } } }
        "501": { description: 未配置在线字幕或对象存储, content: { text/plain: { schema: { type: string } } } }
        "502": { $ref: "#/components/responses/Upstream" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /media/subtitles/share:
    post:
      tags: [媒体库]
      summary: 房主共享字幕
      description: 字幕保存到对象存储（`paircast/subtitles/…`）并记到房间上，随后推送 `paircast.room_updated`。仅房主可调用。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [room_id, file]
              properties:
                uid: { type: string }
                token: { type: string }
                room_id: { type: string }
                label: { type: string }
                file: { type: string, format: binary, description: srt / ass / ssa / vtt，最大 2 MB }
      responses:
        "200":
          description: 共享后的 ref
          content:
            application/json:
              schema: { type: object, properties: { ref: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: 不是房主或不是成员, content: { text/plain: { schema: { type: string } } } }
        "410": { $ref: "#/components/responses/RoomEnded" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /media/stickers:
    get:
      tags: [媒体库]
      summary: 贴纸目录
      description: 原样返回贴纸目录下的 `catalog.json`。
      responses:
        "200":
          description: catalog.json
          content: { application/json: { schema: { type: object } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /media/stickers/pack:
    get:
      tags: [媒体库]
      summary: 贴纸包
      description: 返回 `{id}/pack.json`，每张贴纸附带 `url`、封面附带 `cover_url`（预签名 7 天）。
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: pack.json
          content: { application/json: { schema: { type: object } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /room:
    get:
      tags: [观影房间]
      summary: 房间状态
      parameters:
        - { name: room_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: 房间
          content: { application/json: { schema: { $ref: "#/components/schemas/WatchRoom" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: 不是成员, content: { text/plain: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /room/create:
    post:
      tags: [观影房间]
      summary: 新建房间
      description: 同时创建一个群（房主为群主），房间 ID 为 UUID。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [movie_id]
              properties:
                movie_id: { type: string }
      responses:
        "200":
          description: 新房间
          content: { application/json: { schema: { $ref: "#/components/schemas/WatchRoom" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /room/join:
    post:
      tags: [观影房间]
      summary: 加入房间
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [room_id]
              properties:
                room_id: { type: string }
      responses:
        "200":
          description: 加入后的房间
          content: { application/json: { schema: { $ref: "#/components/schemas/WatchRoom" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/RoomEnded" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /room/leave:
    post:
      tags: [观影房间]
      summary: 离开房间
      description: 房主离开时按加入顺序转让（`transfer_seq` 为客户端的信令序号）；最后一人离开时房间结束。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [room_id]
              properties:
                room_id: { type: string }
                transfer_seq: { type: integer, format: int64 }
      responses:
        "200":
          description: 离开后的房间
          content: { application/json: { schema: { $ref: "#/components/schemas/WatchRoom" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

  /room/update:
    post:
      tags: [观影房间]
      summary: 修改房间
      description: |
        换片、转让房主、结束房间仅房主可做；`last_applied_seq` / `host_transfer_seq` 只增不减。
        带 `if_revision` 时版本不一致返回 409。成功后向其他成员推送 `paircast.room_updated`。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [room_id]
              properties:
                room_id: { type: string }
                movie_id: { type: string }
                host_uid: { type: string }
                host_transfer_seq: { type: integer, format: int64 }
                last_applied_seq: { type: integer, format: int64 }
                status: { type: string, enum: [ended] }
                if_revision: { type: integer, format: int64 }
      responses:
        "200":
          description: 修改后的房间
          content: { application/json: { schema: { $ref: "#/components/schemas/WatchRoom" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: 不是房主或不是成员, content: { text/plain: { schema: { type: string } } } }
        "409": { description: "`if_revision` 与当前版本不一致", content: { text/plain: { schema: { type: string } } } }
        "410": { $ref: "#/components/responses/RoomEnded" }
        "503": { $ref: "#/components/responses/MediaUnavailable" }

components:
  securitySchemes:
    uid:
      type: apiKey
      in: query
      name: uid
      description: 登录返回的 `uid`（GO-IM uid），可省略
    token:
      type: apiKey
      in: query
      name: token
      description: "登录返回的 Paircast 会话令牌 `token`（也可用 `Authorization: Bearer`）"
  responses:
    OK:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, example: ok }
    AdminRequired:
      description: "`admin required`"
      content: { text/plain: { schema: { type: string } } }
    IMUnavailable:
      description: "`im unavailable`：GO-IM 服务端 API 请求失败"
      content: { text/plain: { schema: { type: string } } }
    BadRequest:
      description: 参数缺失或无效
      content: { text/plain: { schema: { type: string } } }
    Unauthorized:
      description: 缺少令牌，或令牌无效、过期、已吊销（`token revoked`），或账号已禁用 / 删除
      content: { text/plain: { schema: { type: string } } }
    Forbidden:
      description: "`uid does not match token`"
      content: { text/plain: { schema: { type: string } } }
    NotFound:
      description: 资源不存在
      content: { text/plain: { schema: { type: string } } }
    MediaUnavailable:
      description: 未配置媒体库（`media.sources` 为空）
      content: { text/plain: { schema: { type: string } } }
    Upstream:
      description: 视频源 / TMDB / OpenSubtitles 请求失败
      content: { text/plain: { schema: { type: string } } }
    RoomEnded:
      description: "`room ended`"
      content: { text/plain: { schema: { type: string } } }
  schemas:
    Profile:
      type: object
      properties:
        uid: { type: string, description: GO-IM uid }
        nickname: { type: string }
        email: { type: string }
        avatar_url: { type: string, description: "相对于 GO-IM 地址，例如 `/avatar/42`" }
        role: { type: string, enum: [user, admin] }
        must_change_password: { type: boolean }
    Session:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          properties:
            token: { type: string, description: Paircast 会话令牌 }
            im:
              type: object
              properties:
                url: { type: string, description: GO-IM 地址，空 = 与本服务同源 }
                uid: { type: string }
                token: { type: string, description: GO-IM 令牌 }
                expires_at: { type: integer, format: int64, description: Unix 秒 }
    AdminUser:
      type: object
      properties:
        uid: { type: string, description: GO-IM uid }
        nickname: { type: string }
        email: { type: string }
        avatar_url: { type: string }
        role: { type: string, enum: [user, admin] }
        is_disabled: { type: boolean }
        created_at: { type: integer, format: int64 }
    Report:
      type: object
      properties:
        id: { type: integer, format: int64 }
        reporter_uid: { type: string }
        reporter_nickname: { type: string }
        target_uid: { type: string }
        target_nickname: { type: string }
        target_disabled: { type: boolean, description: 被举报人的 GO-IM 账号是否已禁用 }
        message_id: { type: string }
        context: { type: string, description: 举报发生的会话（如房间群 ID） }
        content: { type: string }
        status: { type: string, enum: [pending, ignored, banned] }
        handled_by: { type: string }
        created_at: { type: integer, format: int64 }
        handled_at: { type: integer, format: int64 }
    MediaSource:
      type: object
      properties:
        id: { type: string, example: oss }
        name: { type: string }
        type: { type: string, example: s3 }
        capabilities: { type: array, items: { type: string }, example: [sidecar_subtitles, artwork, stickers] }
    MediaItem:
      type: object
      properties:
        id: { type: string, description: "`<source>:<native>`", example: "oss:films/Inception.2010.mkv" }
        source_id: { type: string }
        title: { type: string }
        year: { type: string }
        overview: { type: string }
        poster_url: { type: string }
        backdrop_url: { type: string }
        format: { type: string }
        size: { type: integer, format: int64 }
    SubtitleRef:
      type: object
      properties:
        ref: { type: string }
        label: { type: string }
        language: { type: string }
        badge: { type: string }
        format: { type: string }
        origin: { type: string, enum: [sidecar, shared, online] }
        detail: { type: string }
    WatchRoom:
      type: object
      properties:
        id: { type: string }
        group_id: { type: string }
        movie_id: { type: string }
        host_uid: { type: string }
        members: { type: array, items: { type: string } }
        join_order: { type: array, items: { type: string } }
        status: { type: string, enum: [active, ended] }
        last_applied_seq: { type: integer, format: int64 }
        host_transfer_seq: { type: integer, format: int64 }
        subtitle_ref: { type: string }
        subtitle_label: { type: string }
        revision: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
