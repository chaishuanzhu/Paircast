# Paircast 用独立域名（与 GO-IM 的域名分开），整站转到 paircast 服务。
# GO-IM 的地址由 paircast.json 的 im.public_url 随登录返回给客户端。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paircast
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 4m
spec:
  # ingressClassName: nginx
  # tls:
  #   - hosts: [paircast.example.com]
  #     secretName: paircast-tls
  rules:
    - host: paircast.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: paircast, port: { name: http } }
