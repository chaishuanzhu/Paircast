apiVersion: v1
kind: Service
metadata:
  name: paircast
spec:
  selector:
    app: paircast
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paircast
spec:
  # 账号与房间状态在 MySQL，可以多副本；在线字幕下载的限流按副本计。
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  selector:
    matchLabels:
      app: paircast
  template:
    metadata:
      labels:
        app: paircast
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        # 与 GO-IM 共用 MySQL 实例，但用独立的 paircast 库与账号：每次启动幂等地建库、建账号并同步密码。
        # 用外部 MySQL 时删掉这个 initContainer，自己建库建账号，并改下方 PAIRCAST_MYSQL_DSN。
        - name: db-init
          image: mysql:8.4
          command:
            - sh
            - -ec
            - |
              until mysqladmin ping -h mysql -u root --silent; do echo "waiting for mysql"; sleep 2; done
              pw=$(printf %s "$PAIRCAST_MYSQL_PASSWORD" | sed "s/'/''/g")
              mysql -h mysql -u root -e "
                CREATE DATABASE IF NOT EXISTS paircast CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
                CREATE USER IF NOT EXISTS 'paircast'@'%' IDENTIFIED BY '$pw';
                ALTER USER 'paircast'@'%' IDENTIFIED BY '$pw';
                GRANT ALL PRIVILEGES ON paircast.* TO 'paircast'@'%';"
          env:
            - name: MYSQL_PWD
              valueFrom: { secretKeyRef: { name: goim-infra, key: MYSQL_ROOT_PASSWORD } }
            - name: PAIRCAST_MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: goim-paircast, key: MYSQL_PASSWORD } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
        - name: wait-gateway
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z -w 2 gateway 8080; do echo "waiting for gateway"; sleep 2; done
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }
      containers:
        - name: paircast
          image: 870027381/paircast-server
          # 接入方密钥 GOIM_APP_PAIRCAST_SECRET / _WEBHOOK_SECRET 与 GO-IM 网关共用 Secret goim-apps。
          envFrom:
            - secretRef: { name: goim-apps }
          env:
            - { name: CONFIG_PATH, value: /etc/paircast/paircast.json }
            - { name: TZ, value: Asia/Shanghai }
            - name: PAIRCAST_SESSION_SECRET
              valueFrom: { secretKeyRef: { name: goim-paircast, key: SESSION_SECRET } }
            - name: PAIRCAST_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: goim-paircast, key: ADMIN_EMAIL, optional: true } }
            - name: PAIRCAST_MAIL_PASSWORD
              valueFrom: { secretKeyRef: { name: goim-paircast, key: MAIL_PASSWORD, optional: true } }
            - name: PAIRCAST_MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: goim-paircast, key: MYSQL_PASSWORD } }
            - name: PAIRCAST_MYSQL_DSN
              value: paircast:$(PAIRCAST_MYSQL_PASSWORD)@tcp(mysql:3306)/paircast?parseTime=true&loc=UTC
            - name: PAIRCAST_BLOB_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: goim-paircast, key: BLOB_ACCESS_KEY } }
            - name: PAIRCAST_BLOB_SECRET_KEY
              valueFrom: { secretKeyRef: { name: goim-paircast, key: BLOB_SECRET_KEY } }
            # 媒体源 id 为 oss 时的密钥（其它 id 按 PAIRCAST_MEDIA_<ID>_* 自行添加）
            - name: PAIRCAST_MEDIA_OSS_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: goim-paircast, key: MEDIA_OSS_ACCESS_KEY } }
            - name: PAIRCAST_MEDIA_OSS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: goim-paircast, key: MEDIA_OSS_SECRET_KEY } }
            - name: PAIRCAST_TMDB_ACCESS_TOKEN
              valueFrom: { secretKeyRef: { name: goim-paircast, key: TMDB_ACCESS_TOKEN } }
            - name: PAIRCAST_OPENSUBTITLES_API_KEY
              valueFrom: { secretKeyRef: { name: goim-paircast, key: OPENSUBTITLES_API_KEY } }
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: "1", memory: 256Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/paircast
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: goim-paircast-config
