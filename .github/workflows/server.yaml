# Go server (server/): vet + unit tests.
name: Server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yaml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yaml"]
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -count=1
