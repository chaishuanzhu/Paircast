# Build a signed App Store IPA on tag push and attach it to the GitHub Release.
# The same tag also releases the APK (android.yaml) and the server image (Jenkins paircast-tags → paircast-server);
# Scripts/release.sh checks the versions and writes the shared release notes.
# Xcode compiles the Kotlin Multiplatform framework during the archive (iosApp/Scripts/xcode-build-shared.sh).
# Intentionally has NO pull_request trigger — fork PRs never run this on the self-hosted Mac.
name: Release IPA

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0). Leave empty to use the checked-out ref name."
        required: false
        type: string
        default: "v1.0.0"

concurrency:
  group: release-ipa-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & archive IPA
    # Hard gate: never run from forks / renamed mirrors
    if: github.repository == 'chaishuanzhu/Paircast'
    runs-on: [self-hosted, macOS, ARM64, paircast]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the workflow trigger ref (tag push commit, or --ref for dispatch).
          # inputs.tag is only for the GitHub Release name, not the source tree.

      - name: Check release versions
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: ./Scripts/release.sh check "${INPUT_TAG:-${GITHUB_REF_NAME}}"

      - name: Ensure vendor SDKs
        run: ./iosApp/Scripts/download-vlckit.sh

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Kotlin shared tests
        run: |
          # The KMP build also configures the Android targets; the runner keeps the SDK at the default path.
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          ./gradlew --no-daemon :shared:core:allTests

      - name: Install Ruby gems
        working-directory: iosApp
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Generate Xcode project
        working-directory: iosApp
        run: |
          # Avoid stale absolute paths from a previous machine/clone layout
          rm -rf Tuist/.build
          tuist install
          tuist generate --no-open

      - name: Archive App Store IPA (Fastlane)
        env:
          # Password for ~/Library/Keychains/iOSDevKeychain-db (not login.keychain).
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # Required by fastlane on many CI shells:
          # https://docs.fastlane.tools/best-practices/continuous-integration/
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        working-directory: iosApp
        run: bundle exec fastlane archive_appstore

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"

          IPA=".asc/artifacts/Paircast.ipa"
          test -f "$IPA"

          ARCHIVE=".asc/artifacts/Paircast.xcarchive/Info.plist"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$ARCHIVE")"
          ASSET_NAME="Paircast-${TAG}-build${BUILD}.ipa"
          cp "$IPA" "$ASSET_NAME"
          ./Scripts/release.sh publish "$TAG" "$ASSET_NAME"

      - name: Update LiveContainer source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          ./Scripts/update-livecontainer-source.sh docs/source.json

          git fetch origin main
          WORKTREE="$(mktemp -d)/paircast-source"
          git worktree add "$WORKTREE" origin/main
          mkdir -p "$WORKTREE/docs" "$WORKTREE/docs/livecontainer"
          cp docs/source.json "$WORKTREE/docs/source.json"
          cp docs/icon.png "$WORKTREE/docs/icon.png"
          cp docs/livecontainer/index.html "$WORKTREE/docs/livecontainer/index.html"

          cd "$WORKTREE"
          git add docs/source.json docs/icon.png docs/livecontainer/index.html
          if git diff --cached --quiet; then
            echo "LiveContainer source unchanged"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore: update LiveContainer source for ${TAG}"
            git push origin HEAD:main
            echo "Pushed LiveContainer source to main (GitHub Pages)"
          fi
          cd -
          git worktree remove "$WORKTREE" --force
