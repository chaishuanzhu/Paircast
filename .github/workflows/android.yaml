# Shared Kotlin tests + debug APK on PRs and main. Runs on GitHub-hosted Linux (safe for fork PRs: no secrets).
# Release builds (signed IPA / APK, TestFlight, GitHub Release) are made by the Jenkins job paircast (ci/jenkins).
name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Shared tests
        run: ./gradlew :shared:core:testDebugUnitTest :shared:data:testDebugUnitTest

      - name: Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paircast-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
