# Gradle
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m
kotlin.native.ignoreDisabledTargets=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Keep in sync with iosApp/Project.swift
paircast.versionName=2.1.0
paircast.versionCode=15
# Minimum GO-IM release (gateway image 870027381/go-im-gateway:<version>); must contain the imserver
# SDK commit in server/go.mod. Written into the GitHub Release and Docker Hub overview (Scripts/release.sh).
paircast.goimVersion=1.9.0
